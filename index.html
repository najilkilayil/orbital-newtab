<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital - New Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo" id="logo">Orbital</div>
    
    <div class="clock" id="clock">
        <p id="date">Undefined</p>
        <p id="time">Undefined</p>
        <p id="day">Undefined</p>
    </div>

    <form class="search_bar" id="search_bar">
        <div class="search_icon" id="search_icon">
            <img src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" alt="">  
        </div>

        <div class="search_input" id="search_input">
            <input type="search" name="" id="search_input_area" placeholder="Search Google..." autocomplete="off" required>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
